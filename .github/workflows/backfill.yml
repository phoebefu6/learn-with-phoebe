name: Backfill repo metadata

# A new course ships almost every day and arrives invisible - no description, no
# homepage link, no topics on its repo card. This closes that gap nightly instead
# of relying on anyone remembering.
#
# Writing to *other* repos needs a token with wider scope than the automatic
# GITHUB_TOKEN, which is repo-local. Store a fine-grained PAT with
# "Administration: read and write" over the account's repos as the secret
# REPO_ADMIN_TOKEN. Without it the job reports what it would do and stops, so a
# missing secret is visible rather than silent.

on:
  schedule:
    - cron: "40 22 * * *" # 06:40 Singapore time, after the stats refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report what is missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/backfill-metadata.py --dry-run

      - name: Apply
        if: ${{ secrets.REPO_ADMIN_TOKEN != '' }}
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: python3 scripts/backfill-metadata.py

      - name: Note the missing secret
        if: ${{ secrets.REPO_ADMIN_TOKEN == '' }}
        run: |
          echo "::warning::REPO_ADMIN_TOKEN is not set, so nothing was applied."
          echo "The dry run above lists what a run would fix. Add a fine-grained PAT"
          echo "with Administration: read and write, saved as REPO_ADMIN_TOKEN."
